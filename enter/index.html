<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Открыть свою страницу</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1b;--mute:#6b6a66;--line:#d9d6ce;--bad:#b3261e;--btn:#1d3550;--btn-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#f1efe9;--mute:#a3a19a;--line:#3a3934;--bad:#ff8a80;--btn:#a9c4e6;--btn-ink:#10202f}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;width:100%;max-width:380px}
h1{font-size:22px;margin:0 0 18px}label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #5b9bd5;outline-offset:2px}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}.hint{color:var(--mute);font-size:14px;margin:8px 0 0}#msg{color:var(--bad);font-size:15px;margin:12px 0 0;min-height:1.4em}
</style></head><body>
<form id="door" autocomplete="off" novalidate>
<h1>Открыть свою страницу</h1>
<label for="code">Ваш код доступа</label>
<input id="code" name="code" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required aria-describedby="hint msg">
<p class="hint" id="hint">Заглавные буквы и пробелы не важны.</p>
<button id="go" type="submit">Открыть</button>
<p id="msg" role="alert"></p>
<noscript><p class="hint">Для этой страницы нужен JavaScript.</p></noscript>
</form>
<script id="door-data" type="application/json">{"salt": "17f8028a18d64b1807936437d43ea966", "iterations": 200000, "doors": {"29925d76c3369f05d82f62f7f4f1f09d53eb385e44cf8bedf871b0a86fc6d2bd": {"site": "https://tolegennuraydn-ctrl.github.io/alkaral-review/", "box": "c8047f8857f48ea4d0adaa6f8ede82d04daa444aeeda181e6747953a3f0259d669"}}, "text": {"wrong": "\u0422\u0430\u043a\u043e\u0433\u043e \u043a\u043e\u0434\u0430 \u043d\u0435\u0442. \u041f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u0438 \u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0435\u0449\u0451 \u0440\u0430\u0437.", "wait": "\u0421\u043b\u0438\u0448\u043a\u043e\u043c \u043c\u043d\u043e\u0433\u043e \u043f\u043e\u043f\u044b\u0442\u043e\u043a. \u041f\u043e\u0434\u043e\u0436\u0434\u0438\u0442\u0435 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u043c\u0438\u043d\u0443\u0442 \u0438 \u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0441\u043d\u043e\u0432\u0430.", "busy": "\u041f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u043c\u2026"}}</script>
<script id="door-logic">
var DoorLogic = (function () {
  function norm(code) { return String(code).replace(/\s+/g, '').toLowerCase(); }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function unhex(s) { var a = new Uint8Array(s.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16); return a; }
  function derive(subtle, code, saltHex, iterations) {   // 96 bytes: find the client · open who the person is · the long token
    return subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unhex(saltHex), iterations: iterations }, k, 768); })
      .then(function (b) { var a = new Uint8Array(b); return { door: hex(a.slice(0, 32)), key: a.slice(32, 64), token: hex(a.slice(64)) }; });
  }
  function slowHash(subtle, code, saltHex, iterations) { return derive(subtle, code, saltHex, iterations).then(function (d) { return d.door; }); }
  function unbox(subtle, key, boxHex) {
    var data = unhex(boxHex), out = new Uint8Array(data.length), jobs = [];
    return subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']).then(function (k) {
      for (var i = 0; i * 32 < data.length; i++) jobs.push(subtle.sign('HMAC', k, new Uint8Array([i])));
      return Promise.all(jobs);
    }).then(function (blocks) {
      for (var i = 0; i < data.length; i++) out[i] = data[i] ^ new Uint8Array(blocks[i >> 5])[i & 31];
      return JSON.parse(new TextDecoder().decode(out));
    });
  }
  // where a typed code leads: the client's site, saying who is reading, with the code after «#» (never sent to a server) — or null
  function target(subtle, data, code) {
    if (!norm(code)) return Promise.resolve(null);
    return derive(subtle, code, data.salt, data.iterations).then(function (d) {
      var e = Object.prototype.hasOwnProperty.call(data.doors, d.door) ? data.doors[d.door] : null;
      if (!e) return null;
      var tail = '#t=' + d.token;   // the long token made from the code — the code itself never leaves this page
      if (!e.box) return e.site + tail;
      return unbox(subtle, d.key, e.box).then(function (who) {
        return e.site + '?r=' + encodeURIComponent(who.r) + '&name=' + encodeURIComponent(who.name) + tail;
      }, function () { return e.site + tail; });
    });
  }
  // a pause after wrong tries, kept in this browser: 5 tries, then 5 minutes
  function allowed(state, now) { return !(state && state.n >= 5 && now - state.at < 5 * 60 * 1000); }
  function failed(state, now) { var s = state && now - state.at < 5 * 60 * 1000 ? state : { n: 0, at: now }; return { n: s.n + 1, at: now }; }
  return { norm: norm, slowHash: slowHash, target: target, allowed: allowed, failed: failed };
})();
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('door-data').textContent), form = document.getElementById('door'),
      input = document.getElementById('code'), go = document.getElementById('go'), msg = document.getElementById('msg');
  function state() { try { return JSON.parse(localStorage.getItem('door_tries') || 'null'); } catch (e) { return null; } }
  function save(s) { try { localStorage.setItem('door_tries', JSON.stringify(s)); } catch (e) { /* private mode */ } }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!DoorLogic.allowed(state(), Date.now())) { msg.textContent = data.text.wait; return; }
    go.disabled = true; msg.textContent = data.text.busy;
    DoorLogic.target(crypto.subtle, data, input.value).then(function (url) {
      if (url) { try { localStorage.removeItem('door_tries'); } catch (e) { /* fine */ } location.replace(url); return; }
      save(DoorLogic.failed(state(), Date.now()));
      setTimeout(function () { go.disabled = false; msg.textContent = data.text.wrong; input.select(); }, 1200);
    }).catch(function () { go.disabled = false; msg.textContent = data.text.wrong; });
  });
})();
</script>
</body></html>
